[package]
name = "lib-web"
version = "0.1.0"
edition = "2021"

[dependencies]
# -- App Libs
lib-utils = { path = "../../libs/lib-utils"}
lib-auth = { path = "../../libs/lib-auth"}
lib-core = { path = "../../libs/lib-core"}

# -- Async
tokio = { version = "1", features = ["full"] }
# -- Json
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { workspace = true }
# -- Validation
validator = { version = "0.19", features = ["derive"] }
# -- Device labels for the active-devices dashboard (display only, never
# used for auth/risk decisions — see risk-rules/login-risk.json for why
# UA strings are trusted for that even less). Real ua-parser project data
# (data/ua-regexes.yaml, from https://github.com/ua-parser/uap-core),
# not hand-written parsing.
ua-parser = "0.2"
serde_yaml = "0.9"
# -- IP location for the active-devices dashboard (display only). Real
# DB-IP City Lite data (fetched by scripts/fetch-geoip-db.sh, CC-BY 4.0),
# not a hand-rolled IP-range table.
maxminddb = "0.24"
# -- Web
axum = { workspace = true }
tower-http = { workspace = true }
tower-cookies = { workspace = true }
# -- Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# -- Others
time = { workspace = true }
uuid = {version = "1", features = ["v4","fast-rng",]}
strum_macros = "0.26"
derive_more = { workspace = true }

[lints]
workspace = true
