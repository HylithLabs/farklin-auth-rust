[package]
name = "lib-auth"
version = "0.1.0"
edition = "2021"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
# -- App Libs
lib-utils = { path = "../../libs/lib-utils"}
# -- Async
tokio = { version = "1", features = ["full"] }
# -- Http (SuperTokens core REST client)
reqwest = { workspace = true }
# -- Json
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# -- Risk engine (login-risk.json is a JDM decision table, not Rust logic —
# see https://gorules.io, editable in their visual editor without a redeploy)
zen-engine = "2"
# -- Tracing
tracing = "0.1"
# -- Others
derive_more = { workspace = true }
