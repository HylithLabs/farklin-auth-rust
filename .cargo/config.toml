# Cargo config file. 
# See: https://doc.rust-lang.org/cargo/reference/config.html

# Environments variables set for all `cargo ...` commands.
[env]

# Scope down tracing, to filter out external lib tracing.
RUST_LOG="web_server=debug,lib_core=debug,lib_web=debug,lib_auth=debug,lib_utils=debug"

# -- Service Environment Variables
# IMPORTANT: 
#   For cargo commands only.
#   For deployed env, should be managed by container 
#   (e.g., Kubernetes).

## -- Secrets
# Password below is for localhost dev ONLY, matches
# docker-compose.dev.yml's postgres service (POSTGRES_USER/DB=farklin).
# i.e., Encryption not needed.

SERVICE_DB_URL="postgres://farklin:farklin@localhost:5432/farklin_auth"

# SuperTokens core (docker-compose.dev.yml's supertokens-core service).
# No API key: the dev core isn't started with API_KEYS set.
SUPERTOKENS_CORE_URL="http://localhost:3567"

## -- ConfigMap

# This will be relative to Cargo.toml
# In deployed images, probably use absolute path.
SERVICE_WEB_FOLDER="web-folder/"