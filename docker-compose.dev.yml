# Development environment for farklin-auth-rust.
#
# Session/auth engine is SuperTokens core (vendored via pinned Docker image,
# not source) — 15k+ stars, actively maintained. This service calls its
# REST API directly over HTTP; no official Rust SDK exists or is needed.
#
# To update SuperTokens: check
# https://hub.docker.com/r/supertokens/supertokens-postgresql/tags
# and bump the image tag below.

services:
  postgres:
    image: postgres:18-alpine
    container_name: farklin-auth-postgres
    environment:
      POSTGRES_USER: farklin
      POSTGRES_PASSWORD: farklin
      POSTGRES_DB: farklin_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farklin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: farklin-auth-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  supertokens-core:
    image: supertokens/supertokens-postgresql:12.1.1
    container_name: farklin-auth-supertokens-core
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://farklin:farklin@postgres:5432/farklin_auth?schema=supertokens"
    ports:
      - "3567:3567"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3567/hello"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
