# Development environment for farklin-auth-rust.
#
# Session/auth engine is SuperTokens core (vendored via pinned Docker image,
# not source) — 15k+ stars, actively maintained. This service calls its
# REST API directly over HTTP; no official Rust SDK exists or is needed.
#
# To update SuperTokens: check
# https://hub.docker.com/r/supertokens/supertokens-postgresql/tags
# and bump the image tag below.

services:
  postgres:
    image: postgres:18-alpine
    container_name: farklin-auth-postgres
    environment:
      POSTGRES_USER: farklin
      POSTGRES_PASSWORD: farklin
      POSTGRES_DB: farklin_auth
    ports:
      # Host port 5434, not 5432 — some dev machines already run native
      # Postgres services (e.g. two side-by-side installs default to 5432
      # AND 5433), which silently win those ports and make this container
      # unreachable from the host (container-internal traffic still uses
      # 5432 — supertokens-core below talks to this over the compose
      # network as `postgres:5432`, unaffected by this host-side remap).
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farklin"]
      interval: 10s
      timeout: 5s
      retries: 5

  supertokens-core:
    image: supertokens/supertokens-postgresql:12.1.1
    container_name: farklin-auth-supertokens-core
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://farklin:farklin@postgres:5432/farklin_auth?schema=supertokens"
      # access: 1hr (SuperTokens default). refresh: 30 days — the actual
      # session lifetime users see. Refreshing does NOT push this deadline
      # forward on its own (confirmed empirically — a refresh right after
      # signup barely moved the expiry timestamp at all); the sliding
      # "never expires while active" behavior is handled in
      # api_refresh_handler (see SLIDING_WINDOW_THRESHOLD_MS in
      # crates/libs/lib-web/src/handlers/handlers_auth.rs), which swaps in
      # a fresh session once this window is more than half spent.
      ACCESS_TOKEN_VALIDITY: "3600"
      REFRESH_TOKEN_VALIDITY: "43200" # 30 days, in minutes
    ports:
      - "3567:3567"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3567/hello"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
